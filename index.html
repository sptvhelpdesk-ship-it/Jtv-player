<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IVAN PLAYER</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  width:100%;
  background:#000;
  overflow:hidden;
  font-family:Segoe UI,sans-serif;
}

.shaka-video-container{
  position:absolute;
  inset:0;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

#channelTitle{
  position:absolute;
  left:15px;
  top:15px;
  background:rgba(0,0,0,0.6);
  padding:6px 12px;
  border-radius:6px;
  font-size:14px;
  z-index:2000;
  color: #fff;
}

#logo{
  position:absolute;
  right:15px;
  top:15px;
  color:#00ffcc;
  font-weight:bold;
  z-index:2000;
}

/* Telegram Style */
#tg-link {
  position: absolute;
  left: 15px;
  bottom: 20px;
  display: flex;
  align-items: center;
  background: rgba(0, 0, 0, 0.7);
  padding: 6px 12px;
  border-radius: 50px;
  text-decoration: none;
  color: #fff;
  font-size: 13px;
  z-index: 3000;
  border: 1px solid #0088cc;
  transition: transform 0.2s;
}

#tg-link:active {
  transform: scale(0.95);
}

#tg-link img {
  width: 18px;
  height: 18px;
  margin-right: 8px;
}

.manual-btn{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  border:2px solid #00ffcc;
  padding:18px 30px;
  border-radius:8px;
  cursor:pointer;
  display:none;
  z-index:3000;
  color: #fff;
}
</style>
</head>
<body>

<div class="shaka-video-container" data-shaka-player>
  <video autoplay muted playsinline></video>
  
  <div id="channelTitle"></div>
  <div id="logo">IVAN PLAYER</div>

  <!-- Telegram ID/Link -->
  <a href="https://t.me/sptvg" target="_blank" id="tg-link">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="TG">
    @sptvg
  </a>

  <div id="manualBtn" class="manual-btn">▶ Click to Play</div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const streamUrl = params.get('url');
const keyId = params.get('keyId');
const key = params.get('key');
const cookieHeader = params.get('cookie');
const channelName = params.get('name') || '';

document.getElementById('channelTitle').textContent = channelName;

document.addEventListener('DOMContentLoaded', async () => {

  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) return;

  const video = document.querySelector('video');
  const player = new shaka.Player(video);
  const container = document.querySelector('.shaka-video-container');
  new shaka.ui.Overlay(player, container, video);

  // ClearKey DRM
  if (keyId && key) {
    player.configure({
      drm: {
        clearKeys: { [keyId]: key }
      }
    });
  }

  // Header + Cookie Injection
  player.getNetworkingEngine().registerRequestFilter((type, request) => {

    request.headers['Referer'] = 'https://www.jiotv.com/';
    request.headers['User-Agent'] =
      "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";

    if (cookieHeader) {
      request.headers['Cookie'] = cookieHeader;

      if (
        (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
         type === shaka.net.NetworkingEngine.RequestType.SEGMENT) &&
        !request.uris[0].includes('__hdnea__=')
      ) {
        const sep = request.uris[0].includes('?') ? '&' : '?';
        request.uris[0] += sep + cookieHeader;
      }
    }

  });

  const manualBtn = document.getElementById('manualBtn');

  async function tryPlay(){
    try{
      video.muted = false;
      await video.play();
      return true;
    }catch{
      try{
        video.muted = true;
        await video.play();
        return true;
      }catch{
        return false;
      }
    }
  }

  try{
    if(streamUrl){
        await player.load(streamUrl);
        if(!(await tryPlay())){
          manualBtn.style.display="block";
        }
    }
  }catch(e){
    console.error(e);
    alert("Stream Load Failed");
  }

  manualBtn.onclick = async ()=>{
    manualBtn.style.display="none";
    video.muted=false;
    await video.play();
  };

});
</script>

</body>
</html>
